name: Build Vibra iOS - FIX

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:

      - name: Scarica il repository
        uses: actions/checkout@v4


      - name: Estrai il progetto PWA Builder
        run: |
          unzip -q "Vibra (8).zip" -d vibra_source


      - name: Trova progetto Xcode
        run: |
          XCODEPROJ=$(find vibra_source -name "*.xcodeproj" -type d | head -1)

          if [ -z "$XCODEPROJ" ]; then
            echo "ERRORE: progetto Xcode non trovato"
            exit 1
          fi

          echo "XCODEPROJ=$XCODEPROJ" >> "$GITHUB_ENV"
          echo "Progetto trovato: $XCODEPROJ"


      - name: Installa CocoaPods
        run: |
          cd "$(dirname "$XCODEPROJ")"
          pod install


      - name: Installa certificato Apple
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/vibra_distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/vibra-signing.keychain-db"

          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN_PATH"

          security default-keychain \
            -s "$KEYCHAIN_PATH"

          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"


      - name: Installa Provisioning Profile
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          PROFILE_PATH="$RUNNER_TEMP/VibraAppStore.mobileprovision"

          echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          PROFILE_UUID=$(
            security cms -D -i "$PROFILE_PATH" |
            plutil -extract UUID raw -
          )

          PROFILE_NAME=$(
            security cms -D -i "$PROFILE_PATH" |
            plutil -extract Name raw -
          )

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          cp "$PROFILE_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

          echo "Provisioning Profile installato"
          echo "Nome: $PROFILE_NAME"
          echo "UUID: $PROFILE_UUID"


      - name: Crea archivio senza forzare firma sui Pods
        run: |
          PROJECT_DIR=$(dirname "$XCODEPROJ")

          WORKSPACE=$(find "$PROJECT_DIR" \
            -maxdepth 1 \
            -name "*.xcworkspace" \
            -type d | head -1)

          echo "Workspace: $WORKSPACE"

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme Vibra \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Vibra.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive


      - name: Crea ExportOptions
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>MA8PHU39TR</string>

              <key>signingCertificate</key>
              <string>Apple Distribution</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>com.vibraalienmatch</key>
                  <string>VibraAppStore</string>
              </dict>
          </dict>
          </plist>
          EOF


      - name: Firma e crea IPA
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Vibra.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"


      - name: Salva IPA
        uses: actions/upload-artifact@v4
        with:
          name: Vibra-IPA
          path: ${{ runner.temp }}/export/*.ipa
