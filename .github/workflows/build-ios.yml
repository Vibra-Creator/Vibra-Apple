name: Vibra iOS - Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Xcode
        run: |
          echo "=== XCODE ==="
          xcodebuild -version

          echo ""
          echo "=== iOS SDK ==="
          xcodebuild -showsdks | grep -i iphoneos

      - name: Recreate Xcode project structure
        run: |
          mkdir -p Vibra.xcodeproj
          cp project.pbxproj Vibra.xcodeproj/project.pbxproj

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
          pod --version
          pod install

      - name: Install signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > certificate.p12

          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain

          security set-keychain-settings -lut 21600 build.keychain

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            build.keychain

          security import certificate.p12 \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k build.keychain

          security list-keychains \
            -d user \
            -s build.keychain login.keychain-db

          security default-keychain \
            -s build.keychain

      - name: Check signing certificate
        run: |
          echo "=== CERTIFICATI PRESENTI ==="

          security find-identity \
            -v \
            -p codesigning \
            build.keychain

          echo ""
          echo "=== CERTIFICATO APPLE DISTRIBUTION ==="

          security find-certificate \
            -a \
            -Z \
            -c "Apple Distribution" \
            build.keychain

      - name: Install provisioning profile
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode \
            > "$HOME/Library/MobileDevice/Provisioning Profiles/VibraAppStoreNew.mobileprovision"

      - name: Verify provisioning profile and certificate
        run: |
          echo "=== DECODIFICA PROFILO ==="

          security cms -D \
            -i "$HOME/Library/MobileDevice/Provisioning Profiles/VibraAppStoreNew.mobileprovision" \
            > profile.plist

          echo ""
          echo "=== PROFILO ==="

          /usr/libexec/PlistBuddy \
            -c "Print :Name" \
            profile.plist

          echo ""
          echo "=== UUID ==="

          /usr/libexec/PlistBuddy \
            -c "Print :UUID" \
            profile.plist

          echo ""
          echo "=== TEAM ID ==="

          /usr/libexec/PlistBuddy \
            -c "Print :TeamIdentifier:0" \
            profile.plist

          echo ""
          echo "=== APP ID ==="

          /usr/libexec/PlistBuddy \
            -c "Print :Entitlements:application-identifier" \
            profile.plist

          echo ""
          echo "=== CERTIFICATI AUTORIZZATI ==="

          python3 <<'PY'
          import plistlib
          import subprocess
          import hashlib
          import sys
          import re
          import os

          with open("profile.plist", "rb") as f:
              profile = plistlib.load(f)

          certificates = profile.get("DeveloperCertificates", [])

          print("Numero certificati nel profilo:", len(certificates))
          print("")

          profile_fingerprints = []

          for index, cert_data in enumerate(certificates):

              cert_file = f"/tmp/profile-cert-{index}.cer"

              with open(cert_file, "wb") as f:
                  f.write(cert_data)

              result = subprocess.run(
                  [
                      "openssl",
                      "x509",
                      "-inform",
                      "der",
                      "-in",
                      cert_file,
                      "-noout",
                      "-fingerprint",
                      "-sha1",
                      "-subject"
                  ],
                  capture_output=True,
                  text=True
              )

              print(f"--- CERTIFICATO PROFILO {index + 1} ---")
              print(result.stdout)

              for line in result.stdout.splitlines():
                  if "sha1 Fingerprint=" in line:
                      fingerprint = line.split("=", 1)[1]
                      fingerprint = re.sub(r"[^0-9A-Fa-f]", "", fingerprint).upper()
                      profile_fingerprints.append(fingerprint)

              os.remove(cert_file)

          print("")
          print("=== CONFRONTO CERTIFICATO / PROFILO ===")

          result = subprocess.run(
              [
                  "security",
                  "find-certificate",
                  "-a",
                  "-Z",
                  "-c",
                  "Apple Distribution",
                  "build.keychain"
              ],
              capture_output=True,
              text=True
          )

          output = result.stdout

          certificate_fingerprints = []

          for line in output.splitlines():

              if "SHA-1" in line.upper():

                  value = line.split("=", 1)[-1]

                  value = re.sub(
                      r"[^0-9A-Fa-f]",
                      "",
                      value
                  ).upper()

                  if len(value) == 40:
                      certificate_fingerprints.append(value)

          if not certificate_fingerprints:
              print("ERRORE: impossibile trovare SHA-1 del certificato.")
              print("")
              print(output)
              sys.exit(1)

          print("SHA-1 certificati GitHub:")

          for fp in certificate_fingerprints:
              print(fp)

          print("")
          print("SHA-1 autorizzati dal profilo:")

          for fp in profile_fingerprints:
              print(fp)

          print("")

          matched = False

          for certificate_fingerprint in certificate_fingerprints:
              if certificate_fingerprint in profile_fingerprints:
                  matched = True
                  print("OK:")
                  print("Il certificato GitHub è autorizzato dal provisioning profile.")
                  print("")
                  print("SHA-1 corrispondente:")
                  print(certificate_fingerprint)
                  break

          if not matched:
              print("ERRORE:")
              print("Nessun certificato GitHub è autorizzato dal provisioning profile.")
              print("")
              print("La build viene fermata.")
              sys.exit(1)

          PY

      - name: Install app entitlements
        run: |
          mkdir -p Vibra/Entitlements

          if [ -f Entitlements.plist ]; then
            cp Entitlements.plist Vibra/Entitlements/Entitlements.plist
          fi

      - name: Configure app signing
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("Vibra.xcodeproj/project.pbxproj")
          text = path.read_text()

          text = text.replace(
              'DEVELOPMENT_TEAM = "";',
              'DEVELOPMENT_TEAM = MA8PHU39TR;'
          )

          text = text.replace(
              'CODE_SIGN_STYLE = Automatic;',
              'CODE_SIGN_STYLE = Manual;'
          )

          text = text.replace(
              'PROVISIONING_PROFILE_SPECIFIER = VibraAppStore;',
              'PROVISIONING_PROFILE_SPECIFIER = VibraAppStoreNew;'
          )

          if 'PROVISIONING_PROFILE_SPECIFIER = VibraAppStoreNew;' not in text:
              text = text.replace(
                  'DEVELOPMENT_TEAM = MA8PHU39TR;',
                  'DEVELOPMENT_TEAM = MA8PHU39TR;\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = VibraAppStoreNew;',
              )

          path.write_text(text)
          PY

          echo "=== CONTROLLO FIRMA APP ==="

          grep -n \
            -E "DEVELOPMENT_TEAM|CODE_SIGN_STYLE|PROVISIONING_PROFILE_SPECIFIER" \
            Vibra.xcodeproj/project.pbxproj || true

      - name: Configure Pods signing
        run: |
          if [ -f Pods/Pods.xcodeproj/project.pbxproj ]; then

            python3 <<'PY'
          from pathlib import Path

          path = Path("Pods/Pods.xcodeproj/project.pbxproj")
          text = path.read_text()

          text = text.replace(
              'CODE_SIGN_STYLE = Manual;',
              'CODE_SIGN_STYLE = Automatic;'
          )

          text = text.replace(
              'PROVISIONING_PROFILE_SPECIFIER = VibraAppStore;',
              'PROVISIONING_PROFILE_SPECIFIER = "";'
          )

          text = text.replace(
              'PROVISIONING_PROFILE_SPECIFIER = VibraAppStoreNew;',
              'PROVISIONING_PROFILE_SPECIFIER = "";'
          )

          path.write_text(text)
          PY

            echo "=== PODS SIGNING ==="

            grep -n \
              -E "CODE_SIGN_STYLE|PROVISIONING_PROFILE_SPECIFIER" \
              Pods/Pods.xcodeproj/project.pbxproj || true

          else
            echo "Pods.xcodeproj non trovato."
          fi

      - name: Show workspace
        run: |
          echo "=== FILES ==="
          find . -maxdepth 2 -type f | sort | head -200

          echo ""
          echo "=== WORKSPACE ==="
          ls -la Vibra.xcworkspace

      - name: Archive app
        run: |
          set -o pipefail

          echo "========================================"
          echo "AVVIO ARCHIVE VIBRA"
          echo "========================================"

          xcodebuild archive \
            -workspace Vibra.xcworkspace \
            -scheme Vibra \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/Vibra.xcarchive" \
            | tee archive.log

      - name: Check archive
        run: |
          echo "=== CONTROLLO ARCHIVE ==="

          if [ ! -d "Vibra.xcarchive" ]; then
            echo "ERRORE: archive non creato."
            echo ""
            echo "=== ULTIME RIGHE DEL LOG ==="
            tail -100 archive.log || true
            exit 1
          fi

          echo "Archive creato correttamente."

          ls -la Vibra.xcarchive

      - name: Create ExportOptions.plist
        run: |
          cat > ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>MA8PHU39TR</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>com.vibraalienmatch</key>
                  <string>VibraAppStoreNew</string>
              </dict>

              <key>destination</key>
              <string>export</string>

              <key>stripSwiftSymbols</key>
              <true/>

              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          PLIST

      - name: Export IPA
        run: |
          set -o pipefail

          echo "========================================"
          echo "ESPORTAZIONE IPA"
          echo "========================================"

          mkdir -p export

          xcodebuild -exportArchive \
            -archivePath "$PWD/Vibra.xcarchive" \
            -exportPath "$PWD/export" \
            -exportOptionsPlist "$PWD/ExportOptions.plist" \
            | tee export.log

      - name: Show IPA
        run: |
          echo "========================================"
          echo "RISULTATO"
          echo "========================================"

          find export \
            -maxdepth 2 \
            -type f \
            -print

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Vibra-iOS-IPA
          path: export/*.ipa
          if-no-files-found: error
