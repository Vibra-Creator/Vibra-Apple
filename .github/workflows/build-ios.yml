name: Vibra iOS - Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Check Xcode
        run: |
          echo "=== XCODE ==="
          xcodebuild -version
          xcode-select -p


      - name: Analyze project structure
        run: |
          echo "=== STRUTTURA PROGETTO ==="
          find . -maxdepth 3 -type f \
            \( -name "*.xcodeproj" -o -name "*.xcworkspace" -o -name "Podfile" \) \
            -print


      - name: Recreate Xcode project structure
        run: |
          echo "=== CONTROLLO PROGETTO ==="

          if [ ! -d "Vibra.xcodeproj" ]; then
            echo "ERRORE: Vibra.xcodeproj non trovato."
            exit 1
          fi

          if [ ! -f "Vibra.xcodeproj/project.pbxproj" ]; then
            echo "ERRORE: project.pbxproj non trovato."
            exit 1
          fi

          echo "Vibra.xcodeproj trovato."


      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
          pod --version


      - name: Install Pods
        run: |
          if [ -f "Podfile" ]; then
            pod install --repo-update
          else
            echo "Podfile non trovato."
          fi


      - name: Find workspace
        run: |
          echo "=== WORKSPACE ==="

          WORKSPACE=$(find . \
            -maxdepth 3 \
            -name "*.xcworkspace" \
            -not -path "*/Pods/*" \
            | head -n 1)

          if [ -z "$WORKSPACE" ]; then
            echo "ERRORE: nessun xcworkspace trovato."
            exit 1
          fi

          echo "Workspace trovato: $WORKSPACE"

          echo "WORKSPACE=$WORKSPACE" >> "$GITHUB_ENV"


      - name: Verify P12 secrets
        run: |
          echo "=== CONTROLLO SECRET ==="

          if [ -z "${BUILD_CERTIFICATE_BASE64}" ]; then
            echo "ERRORE: BUILD_CERTIFICATE_BASE64 vuoto."
            exit 1
          fi

          if [ -z "${P12_PASSWORD}" ]; then
            echo "ERRORE: P12_PASSWORD vuoto."
            exit 1
          fi

          echo "Secret certificato presente."
          echo "Password P12 presente."
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}


      - name: Create signing keychain
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/vibra-signing.keychain-db"

          security create-keychain \
            -p "temporary-password" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "temporary-password" \
            "$KEYCHAIN_PATH"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN_PATH" login.keychain-db

          security default-keychain \
            -s "$KEYCHAIN_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"


      - name: Import signing certificate
        run: |
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"

          security import \
            "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "temporary-password" \
            "$KEYCHAIN_PATH"

          echo "Certificato importato."
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}


      - name: Check signing certificate
        run: |
          echo "=== CERTIFICATI DISPONIBILI ==="

          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"


      - name: Install provisioning profile
        run: |
          echo "=== INSTALLAZIONE PROVISIONING PROFILE ==="

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          echo "$PROVISIONING_PROFILE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/profile.mobileprovision"

          PROFILE_UUID=$(
            security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" \
            | plutil -extract UUID raw -
          )

          PROFILE_NAME=$(
            security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" \
            | plutil -extract Name raw -
          )

          cp \
            "$RUNNER_TEMP/profile.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

          echo "Profile:"
          echo "$PROFILE_NAME"

          echo "UUID:"
          echo "$PROFILE_UUID"
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}


      - name: Verify signing configuration
        run: |
          echo "=== PROFILO INSTALLATO ==="

          security cms \
            -D \
            -i "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision" \
            > "$RUNNER_TEMP/profile.plist"

          echo "Nome:"
          /usr/libexec/PlistBuddy \
            -c "Print :Name" \
            "$RUNNER_TEMP/profile.plist"

          echo "UUID:"
          /usr/libexec/PlistBuddy \
            -c "Print :UUID" \
            "$RUNNER_TEMP/profile.plist"

          echo "Team:"
          /usr/libexec/PlistBuddy \
            -c "Print :TeamIdentifier:0" \
            "$RUNNER_TEMP/profile.plist"

          echo "Application Identifier:"
          /usr/libexec/PlistBuddy \
            -c "Print :Entitlements:application-identifier" \
            "$RUNNER_TEMP/profile.plist"


      - name: Configure app signing
        run: |
          PROJECT_FILE="Vibra.xcodeproj/project.pbxproj"

          if [ ! -f "$PROJECT_FILE" ]; then
            echo "ERRORE: project.pbxproj principale non trovato."
            exit 1
          fi

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "Vibra.xcodeproj/project.pbxproj"
          )

          text = path.read_text()

          text = text.replace(
              'DEVELOPMENT_TEAM = "";',
              'DEVELOPMENT_TEAM = MA8PHU39TR;'
          )

          text = text.replace(
              'CODE_SIGN_STYLE = Automatic;',
              'CODE_SIGN_STYLE = Manual;'
          )

          text = text.replace(
              'CODE_SIGN_IDENTITY = "iOS Development";',
              'CODE_SIGN_IDENTITY = "Apple Distribution";'
          )

          if (
              'PROVISIONING_PROFILE_SPECIFIER = VibraAppStoreNew;'
              not in text
          ):

              text = text.replace(
                  'DEVELOPMENT_TEAM = MA8PHU39TR;',
                  'DEVELOPMENT_TEAM = MA8PHU39TR;\n'
                  '\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = VibraAppStoreNew;'
              )

          path.write_text(text)

          PY

          echo ""
          echo "=== CONTROLLO FIRMA APP ==="

          grep -n \
            -E "DEVELOPMENT_TEAM|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE_SPECIFIER" \
            Vibra.xcodeproj/project.pbxproj || true


      - name: Configure Pods signing
        run: |
          POD_PROJECT=$(find . \
            -path "*Pods.xcodeproj/project.pbxproj" \
            | head -n 1)

          if [ -n "$POD_PROJECT" ]; then

            echo "Pods project:"
            echo "$POD_PROJECT"

            python3 - "$POD_PROJECT" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])

          text = path.read_text()

          text = text.replace(
              'CODE_SIGN_STYLE = Manual;',
              'CODE_SIGN_STYLE = Automatic;'
          )

          text = text.replace(
              'PROVISIONING_PROFILE_SPECIFIER = VibraAppStoreNew;',
              'PROVISIONING_PROFILE_SPECIFIER = "";'
          )

          path.write_text(text)

          print("Pods signing configurato.")

          PY

          else
            echo "Pods.xcodeproj non trovato."
          fi


      - name: Create Entitlements
        run: |
          echo "=== CREAZIONE ENTITLEMENTS ==="

          mkdir -p "Vibra/Entitlements"

          cat > "Vibra/Entitlements/Entitlements.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          </dict>
          </plist>
          EOF

          echo "Entitlements creato."

          cat "Vibra/Entitlements/Entitlements.plist"


      - name: Show workspace
        run: |
          echo "=== WORKSPACE ==="
          echo "$WORKSPACE"

          echo "=== SCHEMES ==="

          xcodebuild \
            -workspace "$WORKSPACE" \
            -list


      - name: Archive
        run: |
          set -o pipefail

          echo "========================================"
          echo " AVVIO ARCHIVE VIBRA"
          echo "========================================"

          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme Vibra \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/Vibra.xcarchive" \
            | tee archive.log

          STATUS=${PIPESTATUS[0]}

          if [ "$STATUS" -ne 0 ]; then

            echo ""
            echo "========================================"
            echo " ARCHIVE FALLITO"
            echo "========================================"

            tail -n 150 archive.log || true

            exit "$STATUS"

          fi


      - name: Check archive
        run: |
          echo "=== CONTROLLO ARCHIVE ==="

          if [ ! -d "Vibra.xcarchive" ]; then
            echo "ERRORE: Vibra.xcarchive non trovato."
            exit 1
          fi

          echo "Archive creato correttamente."

          ls -la Vibra.xcarchive


      - name: Create ExportOptions
        run: |
          echo "=== CREAZIONE EXPORTOPTIONS ==="

          cat > ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>

              <key>method</key>
              <string>app-store</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>MA8PHU39TR</string>

              <key>provisioningProfiles</key>
              <dict>

                  <key>com.vibraalienmatch</key>
                  <string>VibraAppStoreNew</string>

              </dict>

              <key>destination</key>
              <string>export</string>

              <key>stripSwiftSymbols</key>
              <true/>

              <key>compileBitcode</key>
              <false/>

          </dict>
          </plist>
          EOF

          cat ExportOptions.plist


      - name: Export IPA
        run: |
          set -o pipefail

          echo "========================================"
          echo " ESPORTAZIONE IPA"
          echo "========================================"

          xcodebuild -exportArchive \
            -archivePath "$PWD/Vibra.xcarchive" \
            -exportPath "$PWD/export" \
            -exportOptionsPlist "$PWD/ExportOptions.plist" \
            | tee export.log

          STATUS=${PIPESTATUS[0]}

          if [ "$STATUS" -ne 0 ]; then

            echo ""
            echo "========================================"
            echo " EXPORT FALLITO"
            echo "========================================"

            tail -n 150 export.log || true

            exit "$STATUS"

          fi


      - name: Show IPA
        run: |
          echo "=== IPA GENERATO ==="

          find export \
            -maxdepth 2 \
            -type f \
            -name "*.ipa" \
            -print

          IPA=$(find export \
            -maxdepth 2 \
            -type f \
            -name "*.ipa" \
            | head -n 1)

          if [ -z "$IPA" ]; then
            echo "ERRORE: IPA non trovato."
            exit 1
          fi

          echo "IPA:"
          echo "$IPA"


      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Vibra-iOS-IPA
          path: export/*.ipa
          if-no-files-found: error


      - name: Upload build logs
        uses: actions/upload-artifact@v4
        with:
          name: Vibra-iOS-Build-Logs
          path: |
            archive.log
            export.log
          if-no-files-found: warn
