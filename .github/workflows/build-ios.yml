name: Vibra iOS - Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Xcode
        run: |
          echo "=== XCODE ==="
          xcodebuild -version
          echo ""
          echo "=== iOS SDK ==="
          xcodebuild -showsdks | grep -i iphoneos

      - name: Recreate Xcode project structure
        run: |
          mkdir -p Vibra.xcodeproj
          cp project.pbxproj Vibra.xcodeproj/project.pbxproj

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
          pod --version
          pod install

      - name: Install signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > certificate.p12

          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain

          security import certificate.p12 \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k build.keychain

          security list-keychains -d user -s build.keychain login.keychain-db
          security default-keychain -s build.keychain

      - name: Check signing certificate
        run: |
          echo "=== CERTIFICATI PRESENTI ==="
          security find-identity -v -p codesigning build.keychain

          echo ""
          echo "=== SHA-1 CERTIFICATO ==="
          security find-certificate -a -Z -c "Apple Distribution" build.keychain

      - name: Install provisioning profile
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode \
            > "$HOME/Library/MobileDevice/Provisioning Profiles/VibraAppStore.mobileprovision"

      - name: Inspect provisioning profile
        run: |
          echo "=== DECODIFICA PROVISIONING PROFILE ==="

          security cms -D \
            -i "$HOME/Library/MobileDevice/Provisioning Profiles/VibraAppStore.mobileprovision" \
            > profile.plist

          echo ""
          echo "=== NOME PROFILO ==="
          /usr/libexec/PlistBuddy -c "Print :Name" profile.plist || true

          echo ""
          echo "=== UUID PROFILO ==="
          /usr/libexec/PlistBuddy -c "Print :UUID" profile.plist || true

          echo ""
          echo "=== TEAM ID ==="
          /usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" profile.plist || true

          echo ""
          echo "=== APP ID ==="
          /usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" profile.plist || true

          echo ""
          echo "=== BUNDLE ID ==="
          /usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.developer.team-identifier" profile.plist || true

          echo ""
          echo "=== CAPABILITIES ==="
          /usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.developer.associated-domains" profile.plist || true
          /usr/libexec/PlistBuddy -c "Print :Entitlements:aps-environment" profile.plist || true

          echo ""
          echo "=== CERTIFICATI AUTORIZZATI DAL PROFILO ==="

          python3 <<'PY'
          import plistlib
          import subprocess
          import tempfile
          import os

          with open("profile.plist", "rb") as f:
              profile = plistlib.load(f)

          certificates = profile.get("DeveloperCertificates", [])

          print("Numero certificati nel provisioning profile:", len(certificates))
          print("")

          for index, cert_data in enumerate(certificates):
              cert_file = f"/tmp/profile-cert-{index}.cer"

              with open(cert_file, "wb") as f:
                  f.write(cert_data)

              print(f"--- CERTIFICATO {index + 1} ---")

              try:
                  result = subprocess.run(
                      [
                          "openssl",
                          "x509",
                          "-inform",
                          "der",
                          "-in",
                          cert_file,
                          "-noout",
                          "-fingerprint",
                          "-sha1",
                          "-subject"
                      ],
                      capture_output=True,
                      text=True
                  )

                  print(result.stdout)

                  if result.stderr:
                      print(result.stderr)

              finally:
                  if os.path.exists(cert_file):
                      os.remove(cert_file)
          PY

      - name: Stop after profile inspection
        run: |
          echo ""
          echo "========================================"
          echo "CONTROLLO COMPLETATO"
          echo "Il workflow viene fermato volutamente."
          echo "========================================"
          exit 1
