name: Vibra iOS - Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. CHECK XCODE
      # ============================================================
      - name: Check Xcode
        run: |
          echo "========================================"
          echo " VERSIONE XCODE"
          echo "========================================"
          xcodebuild -version
          xcode-select -p

      # ============================================================
      # 3. ANALYZE PROJECT
      # ============================================================
      - name: Analyze project structure
        run: |
          echo "========================================"
          echo " STRUTTURA PROGETTO"
          echo "========================================"

          find . -maxdepth 4 -type f | sort | head -300

      # ============================================================
      # 4. RECREATE XCODE PROJECT STRUCTURE
      # ============================================================
      - name: Recreate Xcode project structure
        run: |
          echo "========================================"
          echo " RICOSTRUZIONE PROGETTO XCODE"
          echo "========================================"

          mkdir -p Vibra.xcodeproj
          mkdir -p Vibra.xcworkspace

          if [ -f "src/Vibra.xcodeproj/project.pbxproj" ]; then
            cp "src/Vibra.xcodeproj/project.pbxproj" \
               "Vibra.xcodeproj/project.pbxproj"
          fi

          if [ -f "src/Vibra.xcworkspace/contents.xcworkspacedata" ]; then
            cp "src/Vibra.xcworkspace/contents.xcworkspacedata" \
               "Vibra.xcworkspace/contents.xcworkspacedata"
          fi

          if [ -f "src/Vibra.xcodeproj/xcshareddata/xcschemes/Vibra.xcscheme" ]; then
            mkdir -p "Vibra.xcodeproj/xcshareddata/xcschemes"

            cp "src/Vibra.xcodeproj/xcshareddata/xcschemes/Vibra.xcscheme" \
               "Vibra.xcodeproj/xcshareddata/xcschemes/Vibra.xcscheme"
          fi

          echo ""
          echo "Progetto:"
          find Vibra.xcodeproj -type f -print || true

          echo ""
          echo "Workspace:"
          find Vibra.xcworkspace -type f -print || true

      # ============================================================
      # 5. INSTALL COCOAPODS
      # ============================================================
      - name: Install CocoaPods
        run: |
          echo "========================================"
          echo " COCOAPODS"
          echo "========================================"

          sudo gem install cocoapods

          pod --version

      # ============================================================
      # 6. INSTALL PODS
      # ============================================================
      - name: Install Pods
        run: |
          echo "========================================"
          echo " INSTALLAZIONE PODS"
          echo "========================================"

          if [ -f "Podfile" ]; then
            pod install
          elif [ -f "src/Podfile" ]; then
            cd src
            pod install
            cd ..
          else
            echo "Podfile non trovato."
          fi

      # ============================================================
      # 7. VERIFY WORKSPACE
      # ============================================================
      - name: Verify workspace
        run: |
          echo "========================================"
          echo " VERIFICA WORKSPACE"
          echo "========================================"

          ls -la

          if [ -d "Vibra.xcworkspace" ]; then
            echo "Workspace Vibra.xcworkspace trovato."
          else
            echo "ERRORE: Vibra.xcworkspace non trovato."
            exit 1
          fi

      # ============================================================
      # 8. VERIFY P12 SECRETS
      # ============================================================
      - name: Verify signing secrets
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          echo "========================================"
          echo " VERIFICA SECRET"
          echo "========================================"

          if [ -z "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "ERRORE: BUILD_CERTIFICATE_BASE64 vuoto."
            exit 1
          fi

          if [ -z "$P12_PASSWORD" ]; then
            echo "ERRORE: P12_PASSWORD vuoto."
            exit 1
          fi

          echo "Secret certificato presente."
          echo "Password certificato presente."

      # ============================================================
      # 9. CREATE SIGNING KEYCHAIN
      # ============================================================
      - name: Create signing keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e

          echo "========================================"
          echo " CREAZIONE KEYCHAIN"
          echo "========================================"

          KEYCHAIN_PATH="$RUNNER_TEMP/vibra-signing.keychain-db"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN_PATH"

          security default-keychain \
            -s "$KEYCHAIN_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      # ============================================================
      # 10. IMPORT SIGNING CERTIFICATE
      # ============================================================
      - name: Import signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e

          echo "========================================"
          echo " IMPORT CERTIFICATO"
          echo "========================================"

          echo "$BUILD_CERTIFICATE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/certificate.p12"

          security import \
            "$RUNNER_TEMP/certificate.p12" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          echo "Certificato importato."

      # ============================================================
      # 11. CHECK SIGNING CERTIFICATE
      # ============================================================
      - name: Check signing certificate
        run: |
          echo "========================================"
          echo " VERIFICA CERTIFICATO"
          echo "========================================"

          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"

      # ============================================================
      # 12. INSTALL PROVISIONING PROFILE
      # ============================================================
      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -e
          set -o pipefail

          echo "========================================"
          echo " INSTALLAZIONE PROVISIONING PROFILE"
          echo "========================================"

          mkdir -p \
            "$HOME/Library/MobileDevice/Provisioning Profiles"

          echo "$PROVISIONING_PROFILE_BASE64" \
            | base64 -D \
            > "$RUNNER_TEMP/profile.mobileprovision"

          echo ""
          echo "Dimensione provisioning profile:"
          wc -c "$RUNNER_TEMP/profile.mobileprovision"

          PROFILE_UUID=$(
            security cms \
              -D \
              -i "$RUNNER_TEMP/profile.mobileprovision" \
              | plutil -extract UUID raw -
          )

          PROFILE_NAME=$(
            security cms \
              -D \
              -i "$RUNNER_TEMP/profile.mobileprovision" \
              | plutil -extract Name raw -
          )

          cp \
            "$RUNNER_TEMP/profile.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

          echo ""
          echo "PROFILE:"
          echo "$PROFILE_NAME"

          echo ""
          echo "UUID:"
          echo "$PROFILE_UUID"

      # ============================================================
      # 13. VERIFY SIGNING CONFIGURATION
      # ============================================================
      - name: Verify signing configuration
        run: |
          echo "========================================"
          echo " VERIFICA SIGNING"
          echo "========================================"

          echo "Team ID:"
          echo "MA8PHU39TR"

          echo ""
          echo "Bundle ID:"
          echo "com.vibraalienmatch"

          echo ""
          echo "Provisioning Profile:"
          echo "$PROFILE_NAME"

          echo ""
          echo "Profile UUID:"
          echo "$PROFILE_UUID"

      # ============================================================
      # 14. CONFIGURE APP SIGNING
      # ============================================================
      - name: Configure app signing
        run: |
          set -e

          echo "========================================"
          echo " CONFIGURAZIONE APP SIGNING"
          echo "========================================"

          python3 <<'PY'
          from pathlib import Path

          p = Path("Vibra.xcodeproj/project.pbxproj")

          if not p.exists():
              print("project.pbxproj non trovato.")
              raise SystemExit(1)

          text = p.read_text()

          text = text.replace(
              'DEVELOPMENT_TEAM = "";',
              'DEVELOPMENT_TEAM = MA8PHU39TR;'
          )

          text = text.replace(
              'CODE_SIGN_STYLE = Automatic;',
              'CODE_SIGN_STYLE = Manual;'
          )

          text = text.replace(
              'CODE_SIGN_IDENTITY = "";',
              'CODE_SIGN_IDENTITY = "Apple Distribution";'
          )

          text = text.replace(
              'PROVISIONING_PROFILE_SPECIFIER = "";',
              'PROVISIONING_PROFILE_SPECIFIER = VibraAppStoreNew;'
          )

          p.write_text(text)

          print("Signing configurato.")
          PY

      # ============================================================
      # 15. CONFIGURE PODS SIGNING
      # ============================================================
      - name: Configure Pods signing
        run: |
          echo "========================================"
          echo " CONFIGURAZIONE PODS"
          echo "========================================"

          find . -name "Pods.xcodeproj" -type d -print

          if [ -f "Pods/Pods.xcodeproj/project.pbxproj" ]; then

            python3 <<'PY'
            from pathlib import Path

            p = Path("Pods/Pods.xcodeproj/project.pbxproj")

            text = p.read_text()

            text = text.replace(
                'CODE_SIGN_STYLE = Manual;',
                'CODE_SIGN_STYLE = Automatic;'
            )

            text = text.replace(
                'PROVISIONING_PROFILE_SPECIFIER = VibraAppStoreNew;',
                'PROVISIONING_PROFILE_SPECIFIER = "";'
            )

            p.write_text(text)

            print("Pods configurati.")
            PY

          fi

      # ============================================================
      # 16. CREATE ENTITLEMENTS
      # ============================================================
      - name: Create Entitlements
        run: |
          echo "========================================"
          echo " CREAZIONE ENTITLEMENTS"
          echo "========================================"

          cat > Vibra.entitlements <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict/>
          </plist>
          EOF

          cat Vibra.entitlements

      # ============================================================
      # 17. ARCHIVE
      # ============================================================
      - name: Archive
        run: |
          set -o pipefail

          echo "========================================"
          echo " ARCHIVE"
          echo "========================================"

          xcodebuild archive \
            -workspace Vibra.xcworkspace \
            -scheme Vibra \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/Vibra.xcarchive" \
            | tee archive.log

      # ============================================================
      # 18. CHECK ARCHIVE
      # ============================================================
      - name: Check archive
        run: |
          echo "========================================"
          echo " VERIFICA ARCHIVE"
          echo "========================================"

          if [ -d "Vibra.xcarchive" ]; then
            echo "Archive creato correttamente."
          else
            echo "ERRORE: Archive non trovato."
            exit 1
          fi

          echo ""
          echo "Contenuto:"
          find Vibra.xcarchive -maxdepth 3 -type f | head -100

      # ============================================================
      # 19. CREATE EXPORT OPTIONS
      # ============================================================
      - name: Create ExportOptions
        run: |
          echo "========================================"
          echo " CREAZIONE EXPORTOPTIONS"
          echo "========================================"

          cat > ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>MA8PHU39TR</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>com.vibraalienmatch</key>
                  <string>VibraAppStoreNew</string>
              </dict>

              <key>destination</key>
              <string>export</string>

              <key>stripSwiftSymbols</key>
              <true/>

              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF

          plutil -lint ExportOptions.plist

          echo ""
          echo "ExportOptions.plist:"
          cat ExportOptions.plist

      # ============================================================
      # 20. EXPORT IPA
      # ============================================================
      - name: Export IPA
        run: |
          set -o pipefail

          echo "========================================"
          echo " EXPORT IPA"
          echo "========================================"

          mkdir -p export

          xcodebuild -exportArchive \
            -archivePath "$PWD/Vibra.xcarchive" \
            -exportPath "$PWD/export" \
            -exportOptionsPlist "$PWD/ExportOptions.plist" \
            | tee export.log

      # ============================================================
      # 21. SHOW IPA
      # ============================================================
      - name: Show IPA
        run: |
          echo "========================================"
          echo " IPA GENERATA"
          echo "========================================"

          find export -type f -maxdepth 2 -print

          if find export -name "*.ipa" -print -quit | grep -q .; then
            echo ""
            echo "IPA GENERATA CORRETTAMENTE."
          else
            echo ""
            echo "ERRORE: IPA non generata."
            exit 1
          fi

      # ============================================================
      # 22. UPLOAD IPA
      # ============================================================
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Vibra-iOS-IPA
          path: export/*.ipa

      # ============================================================
      # 23. UPLOAD BUILD LOGS
      # ============================================================
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Vibra-iOS-Build-Logs
          path: |
            archive.log
            export.log
