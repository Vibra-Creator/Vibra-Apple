name: Vibra iOS - Build App Store

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # 2. XCODE
      # ============================================================

      - name: Check Xcode
        run: |
          echo "========================================"
          echo " XCODE"
          echo "========================================"

          xcodebuild -version

          echo ""
          echo "SDK:"
          xcodebuild -showsdks


      # ============================================================
      # 3. ANALISI STRUTTURA
      # ============================================================

      - name: Analyze project structure
        run: |
          echo "========================================"
          echo " STRUTTURA PROGETTO"
          echo "========================================"

          pwd

          echo ""
          echo "=== ROOT ==="
          ls -la

          echo ""
          echo "=== FILE XCODE ==="
          find . -maxdepth 4 \
            \( -name "*.xcodeproj" -o -name "*.xcworkspace" -o -name "project.pbxproj" \) \
            -print


      # ============================================================
      # 4. RICREA XCODEPROJ
      # ============================================================

      - name: Recreate Xcode project structure
        run: |
          echo "========================================"
          echo " RICREAZIONE XCODEPROJ"
          echo "========================================"

          if [ ! -d "Vibra.xcodeproj" ]; then

            echo "Creo Vibra.xcodeproj..."

            mkdir -p Vibra.xcodeproj

            if [ -f "project.pbxproj" ]; then
              cp project.pbxproj Vibra.xcodeproj/project.pbxproj
            else
              echo "ERRORE: project.pbxproj non trovato."
              exit 1
            fi

          else
            echo "Vibra.xcodeproj già presente."
          fi

          echo ""
          echo "=== XCODEPROJ ==="
          ls -la Vibra.xcodeproj


      # ============================================================
      # 5. COCOAPODS
      # ============================================================

      - name: Install CocoaPods
        run: |
          echo "========================================"
          echo " COCOAPODS"
          echo "========================================"

          sudo gem install cocoapods

          pod --version


      # ============================================================
      # 6. POD INSTALL
      # ============================================================

      - name: Install Pods
        run: |
          echo "========================================"
          echo " INSTALLAZIONE PODS"
          echo "========================================"

          pod install --repo-update

          echo ""
          echo "=== WORKSPACE ==="
          find . -maxdepth 3 \
            \( -name "*.xcworkspace" -o -name "Pods.xcodeproj" \) \
            -print


      # ============================================================
      # 7. TROVA WORKSPACE
      # ============================================================

      - name: Find workspace
        run: |
          echo "========================================"
          echo " RICERCA WORKSPACE"
          echo "========================================"

          WORKSPACE=$(find . \
            -maxdepth 3 \
            -name "*.xcworkspace" \
            | head -n 1)

          if [ -z "$WORKSPACE" ]; then
            echo "ERRORE: workspace non trovato."
            exit 1
          fi

          echo "Workspace trovato:"
          echo "$WORKSPACE"


      # ============================================================
      # 8. VERIFICA SECRET P12
      # ============================================================

      - name: Verify P12 secrets
        env:
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        run: |
          echo "========================================"
          echo " VERIFICA SECRET P12"
          echo "========================================"

          echo ""
          echo "=== SHA-256 PASSWORD RICEVUTA DA GITHUB ==="

          printf '%s' "$P12_PASSWORD" | shasum -a 256

          echo ""
          echo "=== RICOSTRUZIONE P12 DAL SECRET ==="

          echo "$BUILD_CERTIFICATE_BASE64" \
            | base64 --decode \
            > test-github.p12

          echo ""
          echo "=== SHA-256 P12 RICEVUTO DA GITHUB ==="

          shasum -a 256 test-github.p12

          echo ""
          echo "=== DIMENSIONE P12 ==="

          ls -lh test-github.p12


      # ============================================================
      # 9. KEYCHAIN
      # ============================================================

      - name: Create signing keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "========================================"
          echo " CREAZIONE KEYCHAIN"
          echo "========================================"

          KEYCHAIN_PATH="$RUNNER_TEMP/vibra-signing.keychain-db"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN_PATH" \
            login.keychain-db

          security default-keychain \
            -s "$KEYCHAIN_PATH"


      # ============================================================
      # 10. IMPORT CERTIFICATO
      # ============================================================

      - name: Import signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "========================================"
          echo " IMPORT CERTIFICATO"
          echo "========================================"

          CERTIFICATE_PATH="$RUNNER_TEMP/signing_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/vibra-signing.keychain-db"

          echo "$BUILD_CERTIFICATE_BASE64" \
            | base64 --decode \
            > "$CERTIFICATE_PATH"

          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/xcodebuild

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          echo ""
          echo "=== CERTIFICATI PRESENTI ==="

          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"


      # ============================================================
      # 11. CONTROLLO CERTIFICATO
      # ============================================================

      - name: Check signing certificate
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "========================================"
          echo " CONTROLLO FIRMA"
          echo "========================================"

          KEYCHAIN_PATH="$RUNNER_TEMP/vibra-signing.keychain-db"

          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"

          echo ""
          echo "=== CERTIFICATO APPLE DISTRIBUTION ==="

          security find-certificate \
            -a \
            -c "Apple Distribution" \
            "$KEYCHAIN_PATH" \
            | head -n 30


      # ============================================================
      # 12. INSTALLA PROVISIONING PROFILE
      # ============================================================

      - name: Install provisioning profile
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          echo "========================================"
          echo " INSTALLAZIONE PROVISIONING PROFILE"
          echo "========================================"

          PROFILE_PATH="$RUNNER_TEMP/VibraAppStoreNew.mobileprovision"

          echo "$BUILD_PROVISION_PROFILE_BASE64" \
            | base64 --decode \
            > "$PROFILE_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          cp "$PROFILE_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/VibraAppStoreNew.mobileprovision"

          echo ""
          echo "=== PROFILE INSTALLATO ==="

          ls -lh \
            "$HOME/Library/MobileDevice/Provisioning Profiles/VibraAppStoreNew.mobileprovision"


      # ============================================================
      # 13. VERIFICA PROFILE
      # ============================================================

      - name: Verify provisioning profile
        run: |
          echo "========================================"
          echo " VERIFICA PROVISIONING PROFILE"
          echo "========================================"

          PROFILE="$HOME/Library/MobileDevice/Provisioning Profiles/VibraAppStoreNew.mobileprovision"

          security cms \
            -D \
            -i "$PROFILE" \
            > profile.plist

          echo ""
          echo "=== NOME ==="

          /usr/libexec/PlistBuddy \
            -c "Print :Name" \
            profile.plist

          echo ""
          echo "=== UUID ==="

          /usr/libexec/PlistBuddy \
            -c "Print :UUID" \
            profile.plist

          echo ""
          echo "=== TEAM ==="

          /usr/libexec/PlistBuddy \
            -c "Print :TeamIdentifier:0" \
            profile.plist

          echo ""
          echo "=== APP ID ==="

          /usr/libexec/PlistBuddy \
            -c "Print :Entitlements:application-identifier" \
            profile.plist

          echo ""
          echo "=== CERTIFICATI AUTORIZZATI ==="

          /usr/libexec/PlistBuddy \
            -c "Print :DeveloperCertificates" \
            profile.plist \
            || true


      # ============================================================
      # 14. CONFIGURAZIONE FIRMA PROGETTO
      # ============================================================

      - name: Configure app signing
        run: |
          echo "========================================"
          echo " CONFIGURAZIONE FIRMA APP"
          echo "========================================"

          PROJECT_FILE="Vibra.xcodeproj/project.pbxproj"

          if [ ! -f "$PROJECT_FILE" ]; then
            echo "ERRORE: project.pbxproj principale non trovato."
            exit 1
          fi

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("Vibra.xcodeproj/project.pbxproj")

          text = path.read_text()

          # TEAM APPLE
          text = re.sub(
              r'DEVELOPMENT_TEAM\s*=\s*[^;]+;',
              'DEVELOPMENT_TEAM = MA8PHU39TR;',
              text
          )

          # FIRMA MANUALE
          text = re.sub(
              r'CODE_SIGN_STYLE\s*=\s*[^;]+;',
              'CODE_SIGN_STYLE = Manual;',
              text
          )

          # DISTRIBUTION
          text = re.sub(
              r'CODE_SIGN_IDENTITY\s*=\s*"[^"]*";',
              'CODE_SIGN_IDENTITY = "Apple Distribution";',
              text
          )

          text = re.sub(
              r'CODE_SIGN_IDENTITY\s*=\s*[^;]+;',
              'CODE_SIGN_IDENTITY = "Apple Distribution";',
              text
          )

          # PROFILE
          text = re.sub(
              r'PROVISIONING_PROFILE_SPECIFIER\s*=\s*[^;]+;',
              'PROVISIONING_PROFILE_SPECIFIER = VibraAppStoreNew;',
              text
          )

          # Se non esistono, li aggiungiamo
          if 'DEVELOPMENT_TEAM = MA8PHU39TR;' not in text:
              text = text.replace(
                  'buildSettings = {',
                  'buildSettings = {\n'
                  '\t\t\t\tDEVELOPMENT_TEAM = MA8PHU39TR;'
              )

          if 'CODE_SIGN_IDENTITY = "Apple Distribution";' not in text:
              text = text.replace(
                  'buildSettings = {',
                  'buildSettings = {\n'
                  '\t\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution";'
              )

          if 'PROVISIONING_PROFILE_SPECIFIER = VibraAppStoreNew;' not in text:
              text = text.replace(
                  'buildSettings = {',
                  'buildSettings = {\n'
                  '\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = VibraAppStoreNew;'
              )

          path.write_text(text)

          PY

          echo ""
          echo "=== CONFIGURAZIONE FIRMA ==="

          grep -n \
            -E "DEVELOPMENT_TEAM|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE_SPECIFIER" \
            Vibra.xcodeproj/project.pbxproj \
            || true


      # ============================================================
      # 15. CONFIGURAZIONE PODS
      # ============================================================

      - name: Configure Pods signing
        run: |
          echo "========================================"
          echo " CONFIGURAZIONE PODS"
          echo "========================================"

          POD_PROJECT=$(find . \
            -path "*Pods.xcodeproj/project.pbxproj" \
            | head -n 1)

          if [ -n "$POD_PROJECT" ]; then

            echo "Pods project:"
            echo "$POD_PROJECT"

            python3 - "$POD_PROJECT" <<'PY'
          import sys
          from pathlib import Path
          import re

          path = Path(sys.argv[1])

          text = path.read_text()

          text = re.sub(
              r'CODE_SIGN_IDENTITY\s*=\s*"[^"]*";',
              'CODE_SIGN_IDENTITY = "";',
              text
          )

          text = re.sub(
              r'CODE_SIGN_IDENTITY\s*=\s*[^;]+;',
              'CODE_SIGN_IDENTITY = "";',
              text
          )

          text = text.replace(
              'CODE_SIGN_STYLE = Manual;',
              'CODE_SIGN_STYLE = Automatic;'
          )

          text = re.sub(
              r'PROVISIONING_PROFILE_SPECIFIER\s*=\s*[^;]+;',
              'PROVISIONING_PROFILE_SPECIFIER = "";',
              text
          )

          path.write_text(text)

          print("Pods signing configurato.")

          PY

          else
            echo "Pods.xcodeproj non trovato."
          fi


      # ============================================================
      # 16. CREA ENTITLEMENTS
      # ============================================================

      - name: Create Entitlements
        run: |
          echo "========================================"
          echo " CREAZIONE ENTITLEMENTS"
          echo "========================================"

          mkdir -p "Vibra/Entitlements"

          cat > "Vibra/Entitlements/Entitlements.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          </dict>
          </plist>
          PLIST

          echo ""
          echo "=== ENTITLEMENTS CREATI ==="

          ls -la "Vibra/Entitlements/Entitlements.plist"

          echo ""
          echo "=== CONTENUTO ==="

          cat "Vibra/Entitlements/Entitlements.plist"


      # ============================================================
      # 17. MOSTRA WORKSPACE
      # ============================================================

      - name: Show workspace
        run: |
          echo "========================================"
          echo " WORKSPACE"
          echo "========================================"

          find . \
            -maxdepth 3 \
            -name "*.xcworkspace" \
            -print


      # ============================================================
      # 18. ARCHIVE
      # ============================================================

      - name: Archive
        run: |
          set -o pipefail

          echo "========================================"
          echo " AVVIO ARCHIVE VIBRA"
          echo "========================================"

          xcodebuild archive \
            -workspace Vibra.xcworkspace \
            -scheme Vibra \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/Vibra.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="MA8PHU39TR" \
            PROVISIONING_PROFILE_SPECIFIER="VibraAppStoreNew" \
            | tee archive.log

          STATUS=${PIPESTATUS[0]}

          if [ "$STATUS" -ne 0 ]; then

            echo ""
            echo "========================================"
            echo " ARCHIVE FALLITO"
            echo "========================================"

            echo ""
            echo "=== ULTIME 200 RIGHE LOG ==="

            tail -n 200 archive.log || true

            exit "$STATUS"

          fi

          echo ""
          echo "========================================"
          echo " ARCHIVE COMPLETATO"
          echo "========================================"


      # ============================================================
      # 19. CONTROLLO ARCHIVE
      # ============================================================

      - name: Check archive
        run: |
          echo "========================================"
          echo " CONTROLLO ARCHIVE"
          echo "========================================"

          if [ ! -d "Vibra.xcarchive" ]; then
            echo "ERRORE: Vibra.xcarchive non trovato."
            exit 1
          fi

          echo ""
          echo "Archive trovato."

          ls -lah Vibra.xcarchive

          echo ""
          echo "=== APP ==="

          find Vibra.xcarchive \
            -maxdepth 3 \
            -name "*.app" \
            -print


      # ============================================================
      # 20. EXPORT OPTIONS
      # ============================================================

      - name: Create ExportOptions
        run: |
          echo "========================================"
          echo " CREAZIONE EXPORTOPTIONS"
          echo "========================================"

          cat > ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>

              <key>method</key>
              <string>app-store</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>MA8PHU39TR</string>

              <key>provisioningProfiles</key>
              <dict>

                  <key>com.vibraalienmatch</key>
                  <string>VibraAppStoreNew</string>

              </dict>

              <key>destination</key>
              <string>export</string>

              <key>stripSwiftSymbols</key>
              <true/>

              <key>compileBitcode</key>
              <false/>

          </dict>
          </plist>
          PLIST

          echo ""
          echo "ExportOptions.plist creato."


      # ============================================================
      # 21. EXPORT IPA
      # ============================================================

      - name: Export IPA
        run: |
          set -o pipefail

          echo "========================================"
          echo " EXPORT IPA"
          echo "========================================"

          xcodebuild \
            -exportArchive \
            -archivePath "$PWD/Vibra.xcarchive" \
            -exportPath "$PWD/export" \
            -exportOptionsPlist "$PWD/ExportOptions.plist" \
            | tee export.log

          STATUS=${PIPESTATUS[0]}

          if [ "$STATUS" -ne 0 ]; then

            echo ""
            echo "========================================"
            echo " EXPORT FALLITO"
            echo "========================================"

            tail -n 200 export.log || true

            exit "$STATUS"

          fi


      # ============================================================
      # 22. MOSTRA IPA
      # ============================================================

      - name: Show IPA
        run: |
          echo "========================================"
          echo " IPA"
          echo "========================================"

          find export \
            -maxdepth 2 \
            -type f \
            -name "*.ipa" \
            -ls


      # ============================================================
      # 23. UPLOAD IPA
      # ============================================================

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Vibra-iOS-IPA
          path: export/*.ipa
          if-no-files-found: error


      # ============================================================
      # 24. UPLOAD LOG
      # ============================================================

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Vibra-iOS-Build-Logs
          path: |
            archive.log
            export.log
            profile.plist
            ExportOptions.plist
          if-no-files-found: ignore
