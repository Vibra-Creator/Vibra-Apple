name: Build Vibra iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4

      - name: Mostra i file
        run: |
          echo "Contenuto repository:"
          ls -la
          echo "Progetti Xcode:"
          find . -name "*.xcodeproj" -o -name "*.xcworkspace"

      - name: Installa CocoaPods
        run: |
          sudo gem install cocoapods
          pod install

      - name: Compila Vibra
        run: |
          xcodebuild \
            -workspace Vibra.xcworkspace \
            -scheme Vibra \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            build
