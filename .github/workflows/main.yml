name: Vibra iOS - Check Build

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
          pod --version

      - name: Check Xcode
        run: |
          echo "=== XCODE VERSION ==="
          xcodebuild -version
          echo ""
          echo "=== AVAILABLE SDKs ==="
          xcodebuild -showsdks

      - name: Recreate Xcode project structure
        run: |
          echo "=== CREAZIONE STRUTTURA XCODE ==="

          mkdir -p Vibra.xcodeproj
          cp project.pbxproj Vibra.xcodeproj/project.pbxproj

          echo "=== VERIFICA ==="
          ls -la Vibra.xcodeproj
          echo ""
          file Vibra.xcodeproj/project.pbxproj

      - name: Install Pods
        run: |
          echo "=== POD INSTALL ==="
          pod install

      - name: Check Project
        run: |
          echo "=== XCODE PROJECT ==="
          ls -la Vibra.xcodeproj

          echo ""
          echo "=== WORKSPACE ==="
          ls -la Vibra.xcworkspace

          echo ""
          echo "=== PROJECT SETTINGS ==="
          xcodebuild \
            -workspace Vibra.xcworkspace \
            -scheme Vibra \
            -showBuildSettings
