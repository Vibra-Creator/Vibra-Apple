name: Vibra iOS - Inspect Project

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository files
        run: |
          echo "=== FILE NEL REPOSITORY ==="
          find . -maxdepth 2 -type f | head -200

      - name: Find and extract ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -1)

          echo "ZIP TROVATO: $ZIP_FILE"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERRORE: Nessun file ZIP trovato"
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          echo "=== CONTENUTO ESTRATTO ==="
          find extracted -maxdepth 4 | head -300

      - name: Find iOS project files
        run: |
          echo "=== XCODE PROJECT ==="
          find extracted -name "*.xcodeproj" -print

          echo "=== XCODE WORKSPACE ==="
          find extracted -name "*.xcworkspace" -print

          echo "=== PODFILE ==="
          find extracted -name "Podfile" -print

          echo "=== PACKAGE.JSON ==="
          find extracted -name "package.json" -print
