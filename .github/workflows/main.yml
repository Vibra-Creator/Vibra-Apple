name: Vibra iOS - Check Build

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
          pod --version

      - name: Check Xcode
        run: |
          echo "=== XCODE VERSION ==="
          xcodebuild -version
          echo ""
          echo "=== AVAILABLE SDKs ==="
          xcodebuild -showsdks

      - name: Show files
        run: |
          echo "=== CARTELLE E FILE DEL REPOSITORY ==="
          pwd
          find . -maxdepth 4 -type f | sort
      - name: Find Xcode project
        run: |
          echo "=== XCODE PROJECTS ==="
        
                   echo "=== PROJECT.PBXPROJ ==="
          find . -name "project.pbxproj" -print echo ""
          echo "=== PODFILE ==="
          find . -name "Podfile"
