name: Vibra iOS - Build IPA

on:
  workflow_dispatch:

jobs:
  build-ios:

    runs-on: macos-latest

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================================
      # 2. XCODE
      # ==========================================================

      - name: Check Xcode
        run: |
          echo "========================================"
          echo " VERSIONE XCODE"
          echo "========================================"

          xcodebuild -version

          echo ""
          echo "=== SDK ==="

          xcodebuild -showsdks


      # ==========================================================
      # 3. ANALISI STRUTTURA PROGETTO
      # ==========================================================

      - name: Analyze project structure
        run: |
          echo "========================================"
          echo " STRUTTURA PROGETTO"
          echo "========================================"

          pwd

          echo ""
          echo "=== ROOT ==="

          ls -la

          echo ""
          echo "=== FILE XCODE ==="

          find . \
            -maxdepth 4 \
            \( -name "project.pbxproj" -o -name "Podfile" \) \
            -print


      # ==========================================================
      # 4. RICOSTRUZIONE XCODEPROJ
      # ==========================================================

      - name: Recreate Xcode project
        run: |
          echo "========================================"
          echo " RICOSTRUZIONE XCODEPROJ"
          echo "========================================"

          if [ ! -f "project.pbxproj" ]; then
            echo "ERRORE: project.pbxproj non trovato."
            exit 1
          fi

          echo "Creo Vibra.xcodeproj"

          mkdir -p Vibra.xcodeproj

          cp project.pbxproj \
             Vibra.xcodeproj/project.pbxproj

          echo ""
          echo "=== VERIFICA ==="

          ls -la Vibra.xcodeproj

          echo ""
          echo "=== PROJECT FILE ==="

          ls -lh Vibra.xcodeproj/project.pbxproj


      # ==========================================================
      # 5. COCOAPODS
      # ==========================================================

      - name: Install CocoaPods
        run: |
          echo "========================================"
          echo " INSTALLAZIONE COCOAPODS"
          echo "========================================"

          sudo gem install cocoapods

          pod --version


      # ==========================================================
      # 6. INSTALL PODS
      # ==========================================================

      - name: Install Pods
        run: |
          echo "========================================"
          echo " INSTALLAZIONE PODS"
          echo "========================================"

          pod install --repo-update

          echo ""
          echo "=== WORKSPACE ==="

          find . \
            -maxdepth 3 \
            -name "*.xcworkspace" \
            -print


      # ==========================================================
      # 7. TROVA WORKSPACE
      # ==========================================================

      - name: Find workspace
        run: |
          echo "========================================"
          echo " VERIFICA WORKSPACE"
          echo "========================================"

          if [ ! -d "Vibra.xcworkspace" ]; then
            echo "ERRORE: Vibra.xcworkspace non trovato."
            exit 1
          fi

          echo "Workspace trovato:"
          ls -la Vibra.xcworkspace

          echo ""
          echo "=== WORKSPACE DATA ==="

          cat Vibra.xcworkspace/contents.xcworkspacedata


      # ==========================================================
      # 8. VERIFICA SECRET P12
      # ==========================================================

      - name: Verify P12 secrets
        env:
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}

        run: |
          echo "========================================"
          echo " VERIFICA SECRET P12"
          echo "========================================"

          echo ""
          echo "=== SHA-256 PASSWORD RICEVUTA DA GITHUB ==="

          printf '%s' "$P12_PASSWORD" \
            | shasum -a 256

          echo ""
          echo "=== RICOSTRUZIONE P12 DAL SECRET ==="

          echo "$BUILD_CERTIFICATE_BASE64" \
            | base64 --decode \
            > test-github.p12

          echo ""
          echo "=== SHA-256 P12 RICEVUTO DA GITHUB ==="

          shasum -a 256 test-github.p12

          echo ""
          echo "=== DIMENSIONE P12 ==="

          ls -lh test-github.p12


      # ==========================================================
      # 9. CREAZIONE KEYCHAIN
      # ==========================================================

      - name: Create signing keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

        run: |
          echo "========================================"
          echo " CREAZIONE KEYCHAIN"
          echo "========================================"

          KEYCHAIN_PATH="$RUNNER_TEMP/vibra-signing.keychain-db"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN_PATH" login.keychain-db

          security default-keychain \
            -s "$KEYCHAIN_PATH"

          echo "Keychain creato."


      # ==========================================================
      # 10. IMPORT CERTIFICATO
      # ==========================================================

      - name: Import signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

        run: |
          echo "========================================"
          echo " IMPORT CERTIFICATO"
          echo "========================================"

          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/vibra-signing.keychain-db"

          echo "$BUILD_CERTIFICATE_BASE64" \
            | base64 --decode \
            > "$CERTIFICATE_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          echo ""
          echo "Certificato importato."


      # ==========================================================
      # 11. VERIFICA CERTIFICATO
      # ==========================================================

      - name: Check signing certificate
        run: |
          echo "========================================"
          echo " VERIFICA CERTIFICATO"
          echo "========================================"

          security find-identity \
            -v \
            -p codesigning \
            "$RUNNER_TEMP/vibra-signing.keychain-db"


      # ==========================================================
      # 12. INSTALL PROVISIONING PROFILE
      # ==========================================================

      - name: Install provisioning profile
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}

        run: |
          echo "========================================"
          echo " INSTALLAZIONE PROVISIONING PROFILE"
          echo "========================================"

          PROFILE_PATH="$RUNNER_TEMP/VibraAppStoreNew.mobileprovision"

          echo "$BUILD_PROVISION_PROFILE_BASE64" \
            | base64 --decode \
            > "$PROFILE_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          cp "$PROFILE_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/"

          echo ""
          echo "Profilo installato."

          ls -lh \
            "$HOME/Library/MobileDevice/Provisioning Profiles/"


      # ==========================================================
      # 13. VERIFICA PROVISIONING PROFILE
      # ==========================================================

      - name: Verify provisioning profile
        run: |
          echo "========================================"
          echo " VERIFICA PROVISIONING PROFILE"
          echo "========================================"

          PROFILE="$RUNNER_TEMP/VibraAppStoreNew.mobileprovision"

          security cms \
            -D \
            -i "$PROFILE" \
            > profile.plist

          echo ""
          echo "=== PROFILE NAME ==="

          /usr/libexec/PlistBuddy \
            -c "Print :Name" \
            profile.plist

          echo ""
          echo "=== UUID ==="

          /usr/libexec/PlistBuddy \
            -c "Print :UUID" \
            profile.plist

          echo ""
          echo "=== TEAM ==="

          /usr/libexec/PlistBuddy \
            -c "Print :TeamIdentifier:0" \
            profile.plist

          echo ""
          echo "=== APPLICATION IDENTIFIER ==="

          /usr/libexec/PlistBuddy \
            -c "Print :Entitlements:application-identifier" \
            profile.plist

          echo ""
          echo "=== CERTIFICATI AUTORIZZATI ==="

          /usr/libexec/PlistBuddy \
            -c "Print :DeveloperCertificates" \
            profile.plist \
            || true


      # ==========================================================
      # 14. CONFIGURAZIONE FIRMA TARGET VIBRA
      # ==========================================================

      - name: Configure app signing
        run: |
          echo "========================================"
          echo " CONFIGURAZIONE FIRMA TARGET VIBRA"
          echo "========================================"

          PROJECT_FILE="Vibra.xcodeproj/project.pbxproj"

          if [ ! -f "$PROJECT_FILE" ]; then
            echo "ERRORE: $PROJECT_FILE non trovato."
            exit 1
          fi

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("Vibra.xcodeproj/project.pbxproj")
          text = path.read_text()

          TEAM = "MA8PHU39TR"
          PROFILE = "VibraAppStoreNew"
          IDENTITY = "Apple Distribution"

          # --------------------------------------------------
          # 1. TROVA IL TARGET VIBRA
          # --------------------------------------------------

          target_match = re.search(
              r'([A-F0-9]{24}) /\* Vibra \*/ = \{'
              r'.*?buildConfigurationList = ([A-F0-9]{24}) /\* Build configuration list for PBXNativeTarget "Vibra" \*/;'
              r'.*?name = Vibra;',
              text,
              re.S
          )

          if not target_match:
              print("ERRORE: target PBXNativeTarget Vibra non trovato.")
              raise SystemExit(1)

          target_uuid = target_match.group(1)
          config_list_uuid = target_match.group(2)

          print("Target Vibra trovato:", target_uuid)
          print("Configuration list:", config_list_uuid)

          # --------------------------------------------------
          # 2. TROVA LE CONFIGURAZIONI DEL TARGET
          # --------------------------------------------------

          config_list_match = re.search(
              rf'{re.escape(config_list_uuid)} /\* Build configuration list for PBXNativeTarget "Vibra" \*/ = \{{'
              r'.*?buildConfigurations = \('
              r'(.*?)'
              r'\);',
              text,
              re.S
          )

          if not config_list_match:
              print("ERRORE: XCConfigurationList del target Vibra non trovata.")
              raise SystemExit(1)

          config_ids_text = config_list_match.group(1)

          config_ids = re.findall(
              r'([A-F0-9]{24}) /\* (?:Debug|Release) \*/',
              config_ids_text
          )

          if not config_ids:
              print("ERRORE: configurazioni Debug/Release del target Vibra non trovate.")
              raise SystemExit(1)

          print("Configurazioni target trovate:", config_ids)

          # --------------------------------------------------
          # 3. MODIFICA SOLO LE CONFIGURAZIONI DEL TARGET
          # --------------------------------------------------

          for config_uuid in config_ids:

              pattern = (
                  rf'({re.escape(config_uuid)} /\* [^*]+ \*/ = \{{'
                  rf'.*?buildSettings = \{{)'
                  rf'(.*?)'
                  rf'(\n\s*\}};)',
              )

              m = re.search(pattern[0], text, re.S)

              if not m:
                  print("ATTENZIONE: buildSettings non trovati per", config_uuid)
                  continue

              settings = m.group(2)

              # Rimuove vecchie impostazioni
              settings = re.sub(
                  r'\n\s*DEVELOPMENT_TEAM\s*=\s*[^;]+;',
                  '',
                  settings
              )

              settings = re.sub(
                  r'\n\s*CODE_SIGN_STYLE\s*=\s*[^;]+;',
                  '',
                  settings
              )

              settings = re.sub(
                  r'\n\s*CODE_SIGN_IDENTITY(?:\[sdk=[^\]]+\])?\s*=\s*[^;]+;',
                  '',
                  settings
              )

              settings = re.sub(
                  r'\n\s*PROVISIONING_PROFILE_SPECIFIER(?:\[sdk=[^\]]+\])?\s*=\s*[^;]+;',
                  '',
                  settings
              )

              # Inserisce firma manuale
              signing = f'''
          			CODE_SIGN_IDENTITY = "{IDENTITY}";
          			CODE_SIGN_STYLE = Manual;
          			DEVELOPMENT_TEAM = {TEAM};
          			PROVISIONING_PROFILE_SPECIFIER = {PROFILE};'''

              settings = settings.rstrip() + signing + "\n"

              text = text[:m.start(2)] + settings + text[m.end(2):]

              print("Firma configurata per:", config_uuid)

          path.write_text(text)

          print("")
          print("CONFIGURAZIONE TARGET VIBRA COMPLETATA.")

          PY

          echo ""
          echo "========================================"
          echo " VERIFICA TARGET VIBRA"
          echo "========================================"

          grep -n \
            -E "DEVELOPMENT_TEAM|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE_SPECIFIER" \
            "$PROJECT_FILE" \
            || true


      # ==========================================================
      # 15. CONFIGURAZIONE PODS
      # ==========================================================

      - name: Configure Pods signing
        run: |
          echo "========================================"
          echo " CONFIGURAZIONE PODS"
          echo "========================================"

          POD_PROJECT=$(find . \
            -path "*Pods.xcodeproj/project.pbxproj" \
            | head -n 1)

          if [ -n "$POD_PROJECT" ]; then

            echo "Pods project:"
            echo "$POD_PROJECT"

            python3 - "$POD_PROJECT" <<'PY'
          import sys
          from pathlib import Path
          import re

          path = Path(sys.argv[1])

          text = path.read_text()

          text = re.sub(
              r'CODE_SIGN_IDENTITY\s*=\s*"[^"]*";',
              'CODE_SIGN_IDENTITY = "";',
              text
          )

          text = re.sub(
              r'CODE_SIGN_IDENTITY\s*=\s*[^;]+;',
              'CODE_SIGN_IDENTITY = "";',
              text
          )

          text = text.replace(
              'CODE_SIGN_STYLE = Manual;',
              'CODE_SIGN_STYLE = Automatic;'
          )

          text = re.sub(
              r'PROVISIONING_PROFILE_SPECIFIER\s*=\s*[^;]+;',
              'PROVISIONING_PROFILE_SPECIFIER = "";',
              text
          )

          path.write_text(text)

          print("Pods signing configurato.")

          PY

          else
            echo "Pods.xcodeproj non trovato."
          fi


      # ==========================================================
      # 16. CREAZIONE ENTITLEMENTS
      # ==========================================================

      - name: Create Entitlements
        run: |
          echo "========================================"
          echo " CREAZIONE ENTITLEMENTS"
          echo "========================================"

          mkdir -p "Vibra/Entitlements"

          cat > "Vibra/Entitlements/Entitlements.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          </dict>
          </plist>
          PLIST

          echo ""
          echo "=== ENTITLEMENTS CREATI ==="

          ls -la "Vibra/Entitlements/Entitlements.plist"

          echo ""
          echo "=== CONTENUTO ==="

          cat "Vibra/Entitlements/Entitlements.plist"


      # ==========================================================
      # 17. VERIFICA WORKSPACE
      # ==========================================================

      - name: Show workspace
        run: |
          echo "========================================"
          echo " VERIFICA WORKSPACE"
          echo "========================================"

          find . \
            -maxdepth 4 \
            \( -name "*.xcworkspace" -o -name "*.xcodeproj" \) \
            -print


      # ==========================================================
      # 18. ARCHIVE
      # ==========================================================

      - name: Archive
        run: |
          set -o pipefail

          echo "========================================"
          echo " AVVIO ARCHIVE VIBRA"
          echo "========================================"

          echo ""
          echo "=== FIRMA UTILIZZATA ==="

          echo "Identity: Apple Distribution"
          echo "Team: MA8PHU39TR"
          echo "Profile: VibraAppStoreNew"

          echo ""
          echo "=== CONTROLLO IMPOSTAZIONI TARGET ==="

          xcodebuild \
            -workspace Vibra.xcworkspace \
            -scheme Vibra \
            -configuration Release \
            -sdk iphoneos \
            -showBuildSettings \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="MA8PHU39TR" \
            | grep -E \
              "TARGET_NAME|CODE_SIGN_IDENTITY|CODE_SIGN_STYLE|DEVELOPMENT_TEAM|PROVISIONING_PROFILE_SPECIFIER" \
            || true

          echo ""
          echo "========================================"
          echo " ESECUZIONE ARCHIVE"
          echo "========================================"

          xcodebuild archive \
            -workspace Vibra.xcworkspace \
            -scheme Vibra \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/Vibra.xcarchive" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="MA8PHU39TR" \
            | tee archive.log

          STATUS=${PIPESTATUS[0]}

          if [ "$STATUS" -ne 0 ]; then

            echo ""
            echo "========================================"
            echo " ARCHIVE FALLITO"
            echo "========================================"

            echo ""
            echo "=== ULTIME 200 RIGHE LOG ==="

            tail -n 200 archive.log || true

            exit "$STATUS"

          fi

          echo ""
          echo "========================================"
          echo " ARCHIVE COMPLETATO"
          echo "========================================"


      # ==========================================================
      # 19. CONTROLLO ARCHIVE
      # ==========================================================

      - name: Check archive
        run: |
          echo "========================================"
          echo " CONTROLLO ARCHIVE"
          echo "========================================"

          if [ ! -d "Vibra.xcarchive" ]; then
            echo "ERRORE: Vibra.xcarchive non trovato."
            exit 1
          fi

          echo ""
          echo "Archive trovato."

          ls -lah Vibra.xcarchive

          echo ""
          echo "=== PRODUCTS ==="

          find Vibra.xcarchive/Products \
            -maxdepth 4 \
            -print


      # ==========================================================
      # 20. EXPORT OPTIONS
      # ==========================================================

      - name: Create ExportOptions
        run: |
          echo "========================================"
          echo " CREAZIONE EXPORTOPTIONS"
          echo "========================================"

          cat > ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>

              <key>method</key>
              <string>app-store</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>MA8PHU39TR</string>

              <key>provisioningProfiles</key>
              <dict>

                  <key>com.vibraalienmatch</key>
                  <string>VibraAppStoreNew</string>

              </dict>

              <key>destination</key>
              <string>export</string>

              <key>stripSwiftSymbols</key>
              <true/>

              <key>compileBitcode</key>
              <false/>

          </dict>
          </plist>
          PLIST

          echo ""
          echo "=== EXPORTOPTIONS ==="

          cat ExportOptions.plist


      # ==========================================================
      # 21. EXPORT IPA
      # ==========================================================

      - name: Export IPA
        run: |
          set -o pipefail

          echo "========================================"
          echo " EXPORT IPA"
          echo "========================================"

          xcodebuild \
            -exportArchive \
            -archivePath "$PWD/Vibra.xcarchive" \
            -exportOptionsPlist "$PWD/ExportOptions.plist" \
            -exportPath "$PWD/export" \
            | tee export.log

          STATUS=${PIPESTATUS[0]}

          if [ "$STATUS" -ne 0 ]; then

            echo ""
            echo "========================================"
            echo " EXPORT FALLITO"
            echo "========================================"

            tail -n 200 export.log || true

            exit "$STATUS"

          fi

          echo ""
          echo "========================================"
          echo " EXPORT COMPLETATO"
          echo "========================================"


      # ==========================================================
      # 22. MOSTRA IPA
      # ==========================================================

      - name: Show IPA
        run: |
          echo "========================================"
          echo " IPA GENERATA"
          echo "========================================"

          find export \
            -maxdepth 2 \
            -type f \
            -name "*.ipa" \
            -print

          echo ""

          ls -lah export || true


      # ==========================================================
      # 23. UPLOAD IPA
      # ==========================================================

      - name: Upload IPA
        uses: actions/upload-artifact@v4

        with:
          name: Vibra-iOS-IPA
          path: |
            export/*.ipa
            Vibra.xcarchive
            archive.log
            export.log

          if-no-files-found: error


      # ==========================================================
      # 24. UPLOAD LOG
      # ==========================================================

      - name: Upload build logs
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: Vibra-build-logs

          path: |
            archive.log
            export.log
            profile.plist
            ExportOptions.plist

          if-no-files-found: ignore
