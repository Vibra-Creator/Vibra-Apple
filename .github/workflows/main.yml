name: Vibra iOS - Build IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================================
      # 2. XCODE
      # ==========================================================

      - name: Check Xcode
        run: |
          echo "========================================"
          echo " VERSIONE XCODE"
          echo "========================================"

          xcodebuild -version

          echo ""
          echo "=== SDK ==="

          xcodebuild -showsdks


      # ==========================================================
      # 3. ANALISI STRUTTURA
      # ==========================================================

      - name: Analyze project structure
        run: |
          echo "========================================"
          echo " STRUTTURA PROGETTO"
          echo "========================================"

          pwd

          echo ""
          echo "=== ROOT ==="

          ls -la

          echo ""
          echo "=== FILE XCODE ==="

          find . \
            -maxdepth 4 \
            \( -name "project.pbxproj" -o -name "Podfile" \) \
            -print


      # ==========================================================
      # 4. RICREA XCODEPROJ
      # ==========================================================

      - name: Recreate Xcode project
        run: |
          echo "========================================"
          echo " RICOSTRUZIONE XCODEPROJ"
          echo "========================================"

          if [ ! -f "project.pbxproj" ]; then
            echo "ERRORE: project.pbxproj non trovato."
            exit 1
          fi

          mkdir -p Vibra.xcodeproj

          cp project.pbxproj \
             Vibra.xcodeproj/project.pbxproj

          echo ""
          echo "=== VERIFICA ==="

          ls -la Vibra.xcodeproj

          if [ ! -f "Vibra.xcodeproj/project.pbxproj" ]; then
            echo "ERRORE: Vibra.xcodeproj non creato."
            exit 1
          fi

          echo "OK: Vibra.xcodeproj creato."


      # ==========================================================
      # 5. COCOAPODS
      # ==========================================================

      - name: Install CocoaPods
        run: |
          echo "========================================"
          echo " INSTALLAZIONE COCOAPODS"
          echo "========================================"

          sudo gem install cocoapods

          pod --version


      # ==========================================================
      # 6. INSTALL PODS
      # ==========================================================

      - name: Install Pods
        run: |
          echo "========================================"
          echo " INSTALLAZIONE PODS"
          echo "========================================"

          pod install --repo-update

          echo ""
          echo "=== WORKSPACE ==="

          find . \
            -maxdepth 3 \
            -name "*.xcworkspace" \
            -print


      # ==========================================================
      # 7. VERIFICA WORKSPACE
      # ==========================================================

      - name: Find workspace
        run: |
          echo "========================================"
          echo " VERIFICA WORKSPACE"
          echo "========================================"

          if [ ! -d "Vibra.xcworkspace" ]; then
            echo "ERRORE: Vibra.xcworkspace non trovato."
            exit 1
          fi

          echo "Workspace trovato."

          ls -la Vibra.xcworkspace


      # ==========================================================
      # 8. VERIFICA P12
      # ==========================================================

      - name: Verify P12 secrets
        env:
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}

        run: |
          echo "========================================"
          echo " VERIFICA SECRET P12"
          echo "========================================"

          printf '%s' "$P12_PASSWORD" | shasum -a 256

          echo "$BUILD_CERTIFICATE_BASE64" \
            | base64 --decode \
            > test-github.p12

          echo ""
          echo "=== SHA-256 P12 ==="

          shasum -a 256 test-github.p12

          echo ""
          echo "=== DIMENSIONE ==="

          ls -lh test-github.p12


      # ==========================================================
      # 9. KEYCHAIN
      # ==========================================================

      - name: Create signing keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

        run: |
          echo "========================================"
          echo " CREAZIONE KEYCHAIN"
          echo "========================================"

          KEYCHAIN_PATH="$RUNNER_TEMP/vibra-signing.keychain-db"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN_PATH" login.keychain-db

          security default-keychain \
            -s "$KEYCHAIN_PATH"

          echo "Keychain creato."


      # ==========================================================
      # 10. IMPORT CERTIFICATO
      # ==========================================================

      - name: Import signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

        run: |
          echo "========================================"
          echo " IMPORT CERTIFICATO"
          echo "========================================"

          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/vibra-signing.keychain-db"

          echo "$BUILD_CERTIFICATE_BASE64" \
            | base64 --decode \
            > "$CERTIFICATE_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          echo "Certificato importato."


      # ==========================================================
      # 11. CONTROLLO CERTIFICATO
      # ==========================================================

      - name: Check signing certificate
        run: |
          echo "========================================"
          echo " CERTIFICATI DISPONIBILI"
          echo "========================================"

          security find-identity \
            -v \
            -p codesigning \
            "$RUNNER_TEMP/vibra-signing.keychain-db"


      # ==========================================================
      # 12. INSTALL PROVISIONING PROFILE
      # ==========================================================

      - name: Install provisioning profile
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}

        run: |
          echo "========================================"
          echo " INSTALLAZIONE PROVISIONING PROFILE"
          echo "========================================"

          PROFILE_PATH="$RUNNER_TEMP/VibraAppStoreNew.mobileprovision"

          echo "$BUILD_PROVISION_PROFILE_BASE64" \
            | base64 --decode \
            > "$PROFILE_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          cp "$PROFILE_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/"

          echo "Profilo installato."


      # ==========================================================
      # 13. VERIFICA PROFILE
      # ==========================================================

      - name: Verify provisioning profile
        run: |
          echo "========================================"
          echo " VERIFICA PROVISIONING PROFILE"
          echo "========================================"

          PROFILE="$RUNNER_TEMP/VibraAppStoreNew.mobileprovision"

          security cms \
            -D \
            -i "$PROFILE" \
            > profile.plist

          echo ""
          echo "=== PROFILE NAME ==="

          /usr/libexec/PlistBuddy \
            -c "Print :Name" \
            profile.plist

          echo ""
          echo "=== UUID ==="

          /usr/libexec/PlistBuddy \
            -c "Print :UUID" \
            profile.plist

          echo ""
          echo "=== TEAM ==="

          /usr/libexec/PlistBuddy \
            -c "Print :TeamIdentifier:0" \
            profile.plist

          echo ""
          echo "=== APPLICATION IDENTIFIER ==="

          /usr/libexec/PlistBuddy \
            -c "Print :Entitlements:application-identifier" \
            profile.plist


      # ==========================================================
      # 14. CONTROLLO COMPATIBILITA CERTIFICATO / PROFILE
      # ==========================================================

      - name: Verify signing compatibility
        env:
          KEYCHAIN_PATH: ${{ runner.temp }}/vibra-signing.keychain-db

        run: |
          echo "========================================"
          echo " VERIFICA SIGNING"
          echo "========================================"

          PROFILE="$RUNNER_TEMP/VibraAppStoreNew.mobileprovision"

          security cms \
            -D \
            -i "$PROFILE" \
            > profile.plist

          echo ""
          echo "=== CERTIFICATI AUTORIZZATI DAL PROFILE ==="

          /usr/libexec/PlistBuddy \
            -c "Print :DeveloperCertificates" \
            profile.plist \
            > profile_certificates.txt

          echo "Profile verificato."

          echo ""
          echo "=== CERTIFICATI NELLA KEYCHAIN ==="

          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"


      # ==========================================================
      # 15. CONFIGURAZIONE FIRMA TARGET VIBRA
      # ==========================================================

      - name: Configure app signing
        run: |
          echo "========================================"
          echo " CONFIGURAZIONE FIRMA TARGET VIBRA"
          echo "========================================"

          PROJECT_FILE="Vibra.xcodeproj/project.pbxproj"

          if [ ! -f "$PROJECT_FILE" ]; then
            echo "ERRORE: project.pbxproj non trovato."
            exit 1
          fi

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("Vibra.xcodeproj/project.pbxproj")
          text = path.read_text()

          TEAM = "MA8PHU39TR"
          PROFILE = "VibraAppStoreNew"
          IDENTITY = "Apple Distribution"

          # Trova tutte le configurazioni di build
          # e applica la firma al progetto Vibra.

          config_pattern = re.compile(
              r'([A-F0-9]{24}) /\* (Debug|Release) \*/ = \{'
              r'(.*?)'
              r'buildSettings = \{'
              r'(.*?)'
              r'\n\s*\};',
              re.S
          )

          matches = list(config_pattern.finditer(text))

          print("Configurazioni trovate:", len(matches))

          for match in reversed(matches):

              config_uuid = match.group(1)
              configuration = match.group(2)
              prefix = match.group(3)
              settings = match.group(4)

              # Non modificare configurazioni Pods.
              if "Pods" in settings:
                  continue

              settings = re.sub(
                  r'\n\s*DEVELOPMENT_TEAM\s*=\s*[^;]+;',
                  '',
                  settings
              )

              settings = re.sub(
                  r'\n\s*CODE_SIGN_STYLE\s*=\s*[^;]+;',
                  '',
                  settings
              )

              settings = re.sub(
                  r'\n\s*CODE_SIGN_IDENTITY(?:\[sdk=[^\]]+\])?\s*=\s*[^;]+;',
                  '',
                  settings
              )

              settings = re.sub(
                  r'\n\s*PROVISIONING_PROFILE_SPECIFIER(?:\[sdk=[^\]]+\])?\s*=\s*[^;]+;',
                  '',
                  settings
              )

              signing = f'''
          			CODE_SIGN_IDENTITY = "{IDENTITY}";
          			CODE_SIGN_STYLE = Manual;
          			DEVELOPMENT_TEAM = {TEAM};
          			PROVISIONING_PROFILE_SPECIFIER = {PROFILE};
              '''

              settings = settings.rstrip() + signing

              start = match.start(4)
              end = match.end(4)

              text = text[:start] + settings + text[end:]

              print(
                  "Firma configurata:",
                  configuration,
                  config_uuid
              )

          path.write_text(text)

          print("")
          print("CONFIGURAZIONE FIRMA COMPLETATA.")

          PY

          echo ""
          echo "=== FIRMA PRESENTE NEL PROJECT ==="

          grep -n \
            -E "DEVELOPMENT_TEAM|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE_SPECIFIER" \
            "$PROJECT_FILE" \
            || true


      # ==========================================================
      # 16. CONFIGURAZIONE PODS
      # ==========================================================

      - name: Configure Pods signing
        run: |
          echo "========================================"
          echo " CONFIGURAZIONE PODS"
          echo "========================================"

          POD_PROJECT=$(find . \
            -path "*Pods.xcodeproj/project.pbxproj" \
            | head -n 1)

          if [ -n "$POD_PROJECT" ]; then

            echo "Pods project:"
            echo "$POD_PROJECT"

            python3 - "$POD_PROJECT" <<'PY'
          import sys
          from pathlib import Path
          import re

          path = Path(sys.argv[1])
          text = path.read_text()

          # I Pods NON devono usare il provisioning
          # profile dell'app.

          text = re.sub(
              r'\n\s*PROVISIONING_PROFILE_SPECIFIER\s*=\s*[^;]+;',
              '',
              text
          )

          text = re.sub(
              r'\n\s*CODE_SIGN_IDENTITY\s*=\s*[^;]+;',
              '',
              text
          )

          text = re.sub(
              r'\n\s*CODE_SIGN_STYLE\s*=\s*Manual;',
              '\n\t\t\t\tCODE_SIGN_STYLE = Automatic;',
              text
          )

          path.write_text(text)

          print("Pods signing configurato.")

          PY

          else
            echo "Pods.xcodeproj non trovato."
          fi


      # ==========================================================
      # 17. ENTITLEMENTS
      # ==========================================================

      - name: Create Entitlements
        run: |
          echo "========================================"
          echo " CREAZIONE ENTITLEMENTS"
          echo "========================================"

          mkdir -p "Vibra/Entitlements"

          cat > "Vibra/Entitlements/Entitlements.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          </dict>
          </plist>
          PLIST

          echo ""
          echo "=== ENTITLEMENTS ==="

          ls -lh "Vibra/Entitlements/Entitlements.plist"


      # ==========================================================
      # 18. VERIFICA WORKSPACE
      # ==========================================================

      - name: Show workspace
        run: |
          echo "========================================"
          echo " VERIFICA WORKSPACE"
          echo "========================================"

          find . \
            -maxdepth 4 \
            \( -name "*.xcworkspace" -o -name "*.xcodeproj" \) \
            -print


      # ==========================================================
      # 19. ARCHIVE
      # ==========================================================

      - name: Archive
        run: |
          set -o pipefail

          echo "========================================"
          echo " AVVIO ARCHIVE VIBRA"
          echo "========================================"

          echo ""
          echo "=== FIRMA UTILIZZATA ==="

          echo "Identity: Apple Distribution"
          echo "Team: MA8PHU39TR"
          echo "Profile: VibraAppStoreNew"

          echo ""
          echo "=== CONTROLLO IMPOSTAZIONI TARGET ==="

          xcodebuild \
            -workspace Vibra.xcworkspace \
            -scheme Vibra \
            -configuration Release \
            -sdk iphoneos \
            -showBuildSettings \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="MA8PHU39TR" \
            PROVISIONING_PROFILE_SPECIFIER="VibraAppStoreNew" \
            | grep -E \
              "TARGET_NAME|CODE_SIGN_IDENTITY|CODE_SIGN_STYLE|DEVELOPMENT_TEAM|PROVISIONING_PROFILE_SPECIFIER" \
            || true

          echo ""
          echo "========================================"
          echo " ESECUZIONE ARCHIVE"
          echo "========================================"

          xcodebuild archive \
            -workspace Vibra.xcworkspace \
            -scheme Vibra \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/Vibra.xcarchive" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="MA8PHU39TR" \
            | tee archive.log

          STATUS=${PIPESTATUS[0]}

          if [ "$STATUS" -ne 0 ]; then

            echo ""
            echo "========================================"
            echo " ARCHIVE FALLITO"
            echo "========================================"

            tail -n 200 archive.log || true

            exit "$STATUS"

          fi

          echo ""
          echo "========================================"
          echo " ARCHIVE COMPLETATO"
          echo "========================================"


      # ==========================================================
      # 20. CONTROLLO ARCHIVE
      # ==========================================================

      - name: Check archive
        run: |
          echo "========================================"
          echo " CONTROLLO ARCHIVE"
          echo "========================================"

          if [ ! -d "Vibra.xcarchive" ]; then
            echo "ERRORE: Vibra.xcarchive non trovato."
            exit 1
          fi

          echo "Archive trovato."

          ls -lah Vibra.xcarchive

          echo ""
          echo "=== APP ==="

          find Vibra.xcarchive/Products \
            -maxdepth 4 \
            -print


      # ==========================================================
      # 21. EXPORT OPTIONS
      # ==========================================================

      - name: Create ExportOptions
        run: |
          echo "========================================"
          echo " CREAZIONE EXPORTOPTIONS"
          echo "========================================"

          cat > ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>

              <key>method</key>
              <string>app-store</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>MA8PHU39TR</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>com.vibraalienmatch</key>
                  <string>VibraAppStoreNew</string>
              </dict>

              <key>destination</key>
              <string>export</string>

              <key>stripSwiftSymbols</key>
              <true/>

              <key>compileBitcode</key>
              <false/>

          </dict>
          </plist>
          PLIST

          echo ""
          echo "=== EXPORTOPTIONS ==="

          cat ExportOptions.plist


      # ==========================================================
      # 22. EXPORT IPA
      # ==========================================================

      - name: Export IPA
        run: |
          set -o pipefail

          echo "========================================"
          echo " EXPORT IPA"
          echo "========================================"

          mkdir -p export

          xcodebuild \
            -exportArchive \
            -archivePath "$PWD/Vibra.xcarchive" \
            -exportPath "$PWD/export" \
            -exportOptionsPlist "$PWD/ExportOptions.plist" \
            | tee export.log

          STATUS=${PIPESTATUS[0]}

          if [ "$STATUS" -ne 0 ]; then

            echo ""
            echo "========================================"
            echo " EXPORT FALLITO"
            echo "========================================"

            tail -n 200 export.log || true

            exit "$STATUS"

          fi

          echo ""
          echo "========================================"
          echo " EXPORT COMPLETATO"
          echo "========================================"


      # ==========================================================
      # 23. MOSTRA IPA
      # ==========================================================

      - name: Show IPA
        run: |
          echo "========================================"
          echo " IPA GENERATA"
          echo "========================================"

          find export \
            -maxdepth 2 \
            -type f \
            -name "*.ipa" \
            -print

          echo ""

          ls -lah export


      # ==========================================================
      # 24. UPLOAD IPA
      # ==========================================================

      - name: Upload IPA
        uses: actions/upload-artifact@v4

        with:
          name: Vibra-iOS-IPA

          path: |
            export/*.ipa
            Vibra.xcarchive
            archive.log
            export.log

          if-no-files-found: error


      # ==========================================================
      # 25. UPLOAD LOG
      # ==========================================================

      - name: Upload build logs
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: Vibra-build-logs

          path: |
            archive.log
            export.log
            profile.plist
            ExportOptions.plist

          if-no-files-found: ignore
